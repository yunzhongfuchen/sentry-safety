<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示词配置 - Sentry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #16213e;
            border-radius: 12px;
        }

        .header h1 {
            color: #e94560;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: #3498db;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #3498db;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            background: #3498db;
            color: white;
        }

        .card {
            background: #16213e;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #e94560;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .form-group textarea {
            width: 100%;
            height: 200px;
            background: #0f3460;
            border: 1px solid #16213e;
            border-radius: 8px;
            padding: 15px;
            color: #eee;
            font-size: 14px;
            font-family: monospace;
            line-height: 1.6;
            resize: vertical;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #e94560;
        }

        .form-group input {
            width: 100%;
            background: #0f3460;
            border: 1px solid #16213e;
            border-radius: 8px;
            padding: 12px;
            color: #eee;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e94560;
        }

        .help-text {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #d63850;
        }

        .btn-secondary {
            background: #3498db;
            color: white;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #2980b9;
        }

        .btn-reset {
            background: #f39c12;
            color: white;
        }

        .btn-reset:hover {
            background: #e67e22;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #27ae60;
            display: block;
        }

        .message.error {
            background: #e74c3c;
            display: block;
        }

        .tips {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .tips h3 {
            color: #3498db;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .tips ul {
            list-style: none;
            font-size: 13px;
            color: #aaa;
        }

        .tips li {
            margin-bottom: 8px;
            padding-left: 15px;
            position: relative;
        }

        .tips li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>提示词配置</h1>
            <div class="nav-links">
                <a href="/">监控主页</a>
                <a href="/records.html">检测记录</a>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="card">
            <h2>系统提示词 (System Prompt)</h2>
            <div class="form-group">
                <label>这段文字会作为 system prompt 发送给大模型，定义分析任务和要求</label>
                <textarea id="promptText" placeholder="输入系统提示词..."></textarea>
            </div>
        </div>

        <div class="card">
            <h2>用户问题 (User Question)</h2>
            <div class="form-group">
                <label>这段文字会跟在图片后面发送给大模型，作为用户的问题</label>
                <input type="text" id="questionText" placeholder="请分析以上视频帧，判断是否有人进入或离开电梯，返回JSON格式结果。">
            </div>
        </div>

        <div class="card">
            <button class="btn btn-primary" onclick="savePrompt()">保存提示词</button>
            <button class="btn btn-reset" onclick="resetPrompt()">恢复默认</button>
        </div>

        <div class="tips">
            <h3>提示：JSON 输出格式说明</h3>
            <ul>
                <li><strong>action</strong>: 返回 "enter"（进入）、"leave"（离开）或 "none"（无动作）</li>
                <li><strong>confidence</strong>: 0.0-1.0 的置信度数值</li>
                <li><strong>reason</strong>: 判断理由的简要说明</li>
                <li>修改提示词后，下次分析时会自动使用新的提示词</li>
            </ul>
        </div>
    </div>

    <script>
        async function loadPrompt() {
            try {
                const res = await fetch('/prompt');
                const data = await res.json();
                document.getElementById('promptText').value = data.prompt || '';
                document.getElementById('questionText').value = data.question || '';
            } catch (e) {
                showMessage('加载提示词失败', 'error');
            }
        }

        async function savePrompt() {
            const prompt = document.getElementById('promptText').value.trim();
            const question = document.getElementById('questionText').value.trim();

            if (!prompt) {
                showMessage('系统提示词不能为空', 'error');
                return;
            }

            try {
                const res = await fetch('/prompt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, question})
                });
                const data = await res.json();
                if (data.success) {
                    showMessage('提示词已保存，下次分析时生效', 'success');
                } else {
                    showMessage(data.message || '保存失败', 'error');
                }
            } catch (e) {
                showMessage('保存失败: ' + e.message, 'error');
            }
        }

        async function resetPrompt() {
            if (!confirm('确定要恢复默认提示词吗？')) return;

            try {
                const res = await fetch('/prompt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: '', question: ''})  // 空值会使用默认
                });
                const data = await res.json();
                if (data.success) {
                    loadPrompt();  // 重新加载
                    showMessage('已恢复默认提示词', 'success');
                }
            } catch (e) {
                showMessage('恢复失败', 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            setTimeout(() => {
                msg.className = 'message';
            }, 5000);
        }

        // 页面加载时获取当前提示词
        loadPrompt();
    </script>
</body>
</html>
