<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频诊断系统 类型管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/glass-clay.css">
    <script src="/static/vue3.global.prod.js"></script>
    <script src="/static/shared.js"></script>
    <style>
        .type-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 18px;
        }
        .type-card {
            padding: 16px;
            border-top: 4px solid;
        }
        .type-card-header {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .type-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .type-card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: var(--bg-soft);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            padding: 24px;
            width: 90%;
            max-width: 640px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .toast {
            position: fixed;
            top: 80px;
            right: 24px;
            padding: 12px 22px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            animation: toastin 0.3s ease;
            box-shadow: var(--glass-shadow);
        }
        .toast.success { background: var(--success); color: white; }
        .toast.error { background: var(--danger); color: white; }
        @keyframes toastin {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .type-card-checkboxes {
            display: flex;
            gap: 16px;
            margin-bottom: 14px;
        }
        .type-card-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .type-card-checkbox input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .type-card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .type-card-grid.cols-4 {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .type-card-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .type-card-field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .type-card-field input,
        .type-card-field select {
            border: none;
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 13px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            box-shadow: var(--clay-shadow-inset);
            outline: none;
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
        }
        .form-card {
            padding: 16px;
            margin-bottom: 16px;
        }
        .form-card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .vlm-prompt-input {
            border: none;
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            box-shadow: var(--clay-shadow-inset);
            outline: none;
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div id="app" class="app-shell">
        <div id="sidebar-root"></div>
        <main class="app-main">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px;">
                <h1 style="font-size: 20px; font-weight: 700;">检测类型管理</h1>
                <button class="clay-button primary" @click="openDialog()">新增类型</button>
            </div>
            <div class="type-cards-grid">
                <div v-for="t in types" :key="t.key" class="glass-card type-card" :style="{ borderTopColor: t.color }">
                    <div class="type-card-header" :style="{ color: t.color }">{{ t.label }}</div>
                    <div class="type-card-meta">模型: {{ t.model_path || '未设置' }}</div>
                    <div class="type-card-meta">策略: {{ t.post_process }}</div>
                    <div class="type-card-actions">
                        <button class="clay-button" @click="openDialog(t)">编辑</button>
                        <button class="clay-button" @click="deleteType(t)">删除</button>
                        <button class="clay-button" @click="uploadModel(t)">上传模型</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- 新增/编辑弹窗 -->
        <div v-if="dialog" class="modal-overlay" @click.self="dialog = null">
            <div class="modal-box">
                <h3 style="margin-bottom: 16px;">{{ dialog._existing ? '编辑类型' : '新增类型' }}</h3>

                <!-- 基本信息卡片 -->
                <div class="glass-card form-card">
                    <div class="form-card-title">基本信息</div>
                    <div class="type-card-grid">
                        <div class="type-card-field"><label>显示名称 *</label><input v-model="dialog.label" placeholder="如：明火" /></div>
                        <div class="type-card-field"><label>颜色 *</label><input type="color" v-model="dialog.color" /></div>
                        <div class="type-card-field"><label>模型路径</label><input v-model="dialog.model_path" placeholder="如：fire_smoke.pt / fire_smoke.rknn" /></div>
                        <div class="type-card-field">
                            <label>后处理策略 *</label>
                            <select v-model="dialog.post_process">
                                <option value="yolo_box">yolo_box</option>
                                <option value="yolo_pose">yolo_pose</option>
                            </select>
                        </div>
                    </div>
                    <details style="margin-top: 12px;">
                        <summary style="cursor: pointer; color: var(--text-muted); font-size: 13px;">更多设置</summary>
                        <div style="margin-top: 12px;">
                            <div class="form-card-title">运行参数默认值</div>
                            <div class="type-card-checkboxes">
                                <label class="type-card-checkbox"><input type="checkbox" v-model="dialog.defaults.enabled" /> 默认启用</label>
                                <label class="type-card-checkbox"><input type="checkbox" v-model="dialog.defaults.use_vlm" /> VLM 复核</label>
                            </div>
                            <div class="type-card-grid cols-4" style="margin-bottom: 10px;">
                                <div class="type-card-field"><label>间隔</label><input type="number" step="0.1" v-model.number="dialog.defaults.interval" /></div>
                                <div class="type-card-field"><label>阈值</label><input type="number" step="0.05" min="0" max="1" v-model.number="dialog.defaults.threshold" /></div>
                                <div class="type-card-field"><label>连续</label><input type="number" min="1" v-model.number="dialog.defaults.consecutive_required" /></div>
                                <div class="type-card-field"><label>冷却</label><input type="number" min="0" v-model.number="dialog.defaults.cooldown" /></div>
                            </div>
                            <div class="type-card-grid">
                                <div class="type-card-field">
                                    <label>报警条件</label>
                                    <select v-model="dialog.defaults.box_count_mode">
                                        <option value="gte">目标数 ≥ a</option>
                                        <option value="lte">目标数 ≤ b</option>
                                        <option value="between">a ≤ 目标数 ≤ b</option>
                                        <option value="outside">目标数 < a 或 > b</option>
                                    </select>
                                </div>
                                <div class="type-card-field" v-if="dialog.defaults.box_count_mode === 'gte'">
                                    <label>a</label><input type="number" min="0" v-model.number="dialog.defaults.box_count_a" />
                                </div>
                                <div class="type-card-field" v-if="dialog.defaults.box_count_mode === 'lte'">
                                    <label>b</label><input type="number" min="0" v-model.number="dialog.defaults.box_count_a" />
                                </div>
                                <template v-if="dialog.defaults.box_count_mode === 'between' || dialog.defaults.box_count_mode === 'outside'">
                                    <div class="type-card-field"><label>a</label><input type="number" min="0" v-model.number="dialog.defaults.box_count_a" /></div>
                                    <div class="type-card-field"><label>b</label><input type="number" min="0" v-model.number="dialog.defaults.box_count_b" /></div>
                                </template>
                            </div>

                            <div class="form-card-title" style="margin-top: 16px;">高级参数</div>
                            <div class="type-card-grid">
                                <div class="type-card-field"><label>模型置信度 (默认 0.5)</label><input type="number" step="0.1" v-model.number="dialog.model_confidence" /></div>
                                <div class="type-card-field"><label>类别过滤</label><input v-model="dialog.classesStr" placeholder="如：0,1" /></div>
                                <div class="type-card-field"><label>巡检显示名</label><input v-model="dialog.inspection_label" /></div>
                            </div>

                            <div class="type-card-field" style="margin-top: 12px;">
                                <label>VLM 复核提示词（留空则使用内置模板）</label>
                                <textarea class="vlm-prompt-input" v-model="dialog.vlm_prompt" rows="6" placeholder="自定义 VLM 复核提示词，如：你正在复核一个工业安全监控系统的..."></textarea>
                            </div>
                        </div>
                    </details>
                </div>

                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button class="clay-button" @click="dialog = null">取消</button>
                    <button class="clay-button primary" @click="saveType">保存</button>
                </div>
            </div>
        </div>

        <!-- 上传模型弹窗 -->
        <div v-if="uploadDialog" class="modal-overlay" @click.self="uploadDialog = null">
            <div class="modal-box">
                <h3 style="margin-bottom: 16px;">上传模型 — {{ uploadDialog.label }}</h3>
                <div class="gc-form-field">
                    <label>选择文件 (.pt / .rknn)</label>
                    <input type="file" accept=".pt,.rknn" :key="uploadDialog.key" ref="fileInput" @change="onFileChange" />
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
                    <button class="clay-button" @click="uploadDialog = null">取消</button>
                    <button class="clay-button primary" @click="doUpload">上传</button>
                </div>
            </div>
        </div>

        <div v-if="toast" :class="['toast', toast.type]">{{ toast.message }}</div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const types = ref([]);
                const dialog = ref(null);
                const uploadDialog = ref(null);
                const toast = ref(null);
                const sidebar = ref(getSidebarContext());
                const fileInput = ref(null);
                let uploadFile = null;

                function showToast(msg, type = 'success') {
                    toast.value = { message: msg, type };
                    setTimeout(() => toast.value = null, 2500);
                }

                async function loadTypes() {
                    try {
                        const data = await safeFetch('/detector/types');
                        types.value = data.types || [];
                    } catch (e) { showToast('加载类型失败', 'error'); }
                }

                function openDialog(t = null) {
                    const defaultDefaults = () => ({
                        enabled: false, interval: 1, threshold: 0.5,
                        consecutive_required: 3, cooldown: 60, use_vlm: false,
                        min_box_count: 1, max_box_count: null,
                        box_count_mode: 'gte', box_count_a: 1, box_count_b: null
                    });
                    if (t) {
                        const copy = JSON.parse(JSON.stringify(t));
                        copy._existing = true;
                        copy.classesStr = (t.classes || []).join(',');
                        // 确保 defaults 所有字段都有值，便于 v-model 双向绑定
                        copy.defaults = Object.assign(defaultDefaults(), copy.defaults || {});
                        // 后端 min/max/mode 字段转换为前端 mode/a/b
                        const fc = fieldsToBoxCountMode(copy.defaults.min_box_count, copy.defaults.max_box_count, copy.defaults.box_count_mode);
                        copy.defaults.box_count_mode = fc.mode;
                        copy.defaults.box_count_a = fc.a ?? 1;
                        copy.defaults.box_count_b = fc.b;
                        dialog.value = copy;
                    } else {
                        dialog.value = {
                            label: '', color: '#888888', model_path: '',
                            post_process: 'yolo_box', classesStr: '', model_confidence: 0.5,
                            vlm_prompt: '', inspection_label: '', _existing: false,
                            defaults: defaultDefaults()
                        };
                    }
                }

                async function saveType() {
                    const d = dialog.value;
                    if (!d.label || !d.color || !d.post_process) { showToast('请填写必填项', 'error'); return; }
                    const payload = {
                        label: d.label, color: d.color, model_path: d.model_path || null,
                        post_process: d.post_process,
                        classes: d.classesStr ? d.classesStr.split(',').map(Number) : null,
                        model_confidence: d.model_confidence,
                        vlm_prompt: d.vlm_prompt || '', inspection_label: d.inspection_label || d.label
                    };
                    // 前端 mode/a/b 转换为后端 min/max/mode 字段
                    const bc = boxCountModeToFields(d.defaults.box_count_mode || 'gte', d.defaults.box_count_a ?? 1, d.defaults.box_count_b);
                    const defaultsPayload = {
                        enabled: d.defaults.enabled,
                        interval: d.defaults.interval,
                        threshold: d.defaults.threshold,
                        consecutive_required: d.defaults.consecutive_required,
                        cooldown: d.defaults.cooldown,
                        use_vlm: d.defaults.use_vlm,
                        min_box_count: bc.min_box_count,
                        max_box_count: bc.max_box_count,
                        box_count_mode: bc.box_count_mode
                    };
                    if (d._existing) {
                        // PUT 接口：defaults 字段平铺在顶层
                        Object.assign(payload, defaultsPayload);
                    } else {
                        // POST 接口：defaults 作为嵌套字段传给 add_type
                        payload.defaults = defaultsPayload;
                    }
                    try {
                        const url = d._existing ? `/detector/types/${d.key}` : '/detector/types';
                        const method = d._existing ? 'PUT' : 'POST';
                        const res = await fetch(url, {
                            method, headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            showToast('保存成功');
                            dialog.value = null;
                            loadTypes();
                        } else {
                            const err = await res.json();
                            showToast(err.error || '保存失败', 'error');
                        }
                    } catch (e) { showToast('保存失败', 'error'); }
                }

                async function deleteType(t) {
                    if (!confirm(`确定删除类型 "${t.label}"？`)) return;
                    try {
                        const res = await fetch(`/detector/types/${t.key}`, { method: 'DELETE' });
                        if (res.ok) { showToast('删除成功'); loadTypes(); }
                        else {
                            const err = await res.json();
                            showToast(err.error || '删除失败', 'error');
                        }
                    } catch (e) { showToast('删除失败', 'error'); }
                }

                function uploadModel(t) {
                    uploadDialog.value = t;
                    uploadFile = null;
                }
                function onFileChange(e) { uploadFile = e.target.files[0]; }

                async function doUpload() {
                    if (!uploadFile) { showToast('请选择文件', 'error'); return; }
                    const formData = new FormData();
                    formData.append('file', uploadFile);
                    try {
                        const res = await fetch(`/detector/types/${uploadDialog.value.key}/model`, {
                            method: 'POST', body: formData
                        });
                        if (res.ok) {
                            showToast('上传成功');
                            uploadDialog.value = null;
                            loadTypes();
                        } else {
                            const err = await res.json();
                            showToast(err.error || '上传失败', 'error');
                        }
                    } catch (e) { showToast('上传失败', 'error'); }
                }

                onMounted(() => {
                    const root = document.getElementById('sidebar-root');
                    if (root) renderSidebar(root, sidebar.value);
                    loadTypes();
                });

                return { types, dialog, uploadDialog, toast, sidebar, fileInput, openDialog, saveType, deleteType, uploadModel, onFileChange, doUpload };
            }
        }).mount('#app');
    </script>
</body>
</html>
